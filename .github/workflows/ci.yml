name: CI — Build and Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/devops-app:latest

      - name: Install yq
        uses: frenck/action-setup-yq@v1

      - name: Update chart values with SHA tag
        run: |
          yq -i '.image.tag = strenv(SHA)' chart/values.yaml
          yq -i '.appVersion = strenv(SHA)' chart/values.yaml
        env:
          SHA: ${{ github.sha }}

      - name: Commit and push values update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chart/values.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "ci: bump image tag to ${GITHUB_SHA::7}"
          git push

hadolint:
        name: Lint Dockerfile
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4

          - name: Run Hadolint
            uses: hadolint/hadolint-action@v3.1.0
            with:
              dockerfile: Dockerfile
              failure-threshold: warning
              format: sarif
              output-file: hadolint-results.sarif

          - name: Upload Hadolint SARIF
            if: always()
            uses: github/codeql-action/upload-sarif@v3
            with:
              sarif_file: hadolint-results.sarif
              category: hadolint
